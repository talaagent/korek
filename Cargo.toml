[workspace]
resolver = "3"
members = ["crates/*", "examples/plugin-example"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/korek"
authors = ["Ian Macalinao <github@igm.pub>"]
homepage = "https://github.com/talaagent/korek"
# Let chains (korek-gen-docs) need 1.88; checked by CI's MSRV job.
rust-version = "1.88"

[workspace.dependencies]
korek-core = { path = "crates/korek-core", version = "0.1.0" }
korek-ir = { path = "crates/korek-ir", version = "0.1.0" }
korek-runtime = { path = "crates/korek-runtime", version = "0.1.0" }
korek-gen-common = { path = "crates/korek-gen-common", version = "0.1.0" }
korek-gen-docs = { path = "crates/korek-gen-docs", version = "0.1.0" }
korek-gen-jsonschema = { path = "crates/korek-gen-jsonschema", version = "0.1.0" }
korek-cli = { path = "crates/korek-cli", version = "0.1.0" }
korek-plugin = { path = "crates/korek-plugin", version = "0.1.0" }
korek-gen-rust = { path = "crates/korek-gen-rust", version = "0.1.0" }
korek-gen-proto = { path = "crates/korek-gen-proto", version = "0.1.0" }
korek-gen-zod = { path = "crates/korek-gen-zod", version = "0.1.0" }
korek-gen-ts = { path = "crates/korek-gen-ts", version = "0.1.0" }
korek = { path = "crates/korek", version = "0.1.0", default-features = false }
korek-testkit = { path = "crates/korek-testkit", version = "0.1.0" }
anyhow = "1"
blake3 = "1"
bpaf = { version = "0.9", features = ["derive"] }
divan = "0.1"
heck = "0.5"
insta = "1"
# kdl-kit (https://github.com/talaagent/kdl-kit): KDL loading, spans and
# node helpers. Pinned by git rev until kdl-kit is on crates.io; then switch
# these to plain `version = "0.1.0"` entries (keep default-features = false).
kdl-load = { version = "0.1.0", git = "https://github.com/talaagent/kdl-kit", rev = "922c43d", default-features = false }
kdl-nodes = { version = "0.1.0", git = "https://github.com/talaagent/kdl-kit", rev = "922c43d", default-features = false }
kdl-span = { version = "0.1.0", git = "https://github.com/talaagent/kdl-kit", rev = "922c43d", default-features = false }
miette = "7"
regex = "1"
# korek-ir and korek-gen-common are no_std + alloc; the other crates opt
# back into `std`.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "preserve_order"] }
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
clone_on_ref_ptr = "deny"
many_single_char_names = "allow"
