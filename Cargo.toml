[workspace]
resolver = "3"
members = ["crates/*", "examples/plugin-example"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/korek"
authors = ["Ian Macalinao <github@igm.pub>"]
rust-version = "1.85"
publish = false

[workspace.dependencies]
korek-core = { path = "crates/korek-core" }
korek-ir = { path = "crates/korek-ir" }
korek-runtime = { path = "crates/korek-runtime" }
korek-gen-common = { path = "crates/korek-gen-common" }
korek-gen-docs = { path = "crates/korek-gen-docs" }
korek-gen-jsonschema = { path = "crates/korek-gen-jsonschema" }
korek-cli = { path = "crates/korek-cli" }
korek-plugin = { path = "crates/korek-plugin" }
korek-gen-rust = { path = "crates/korek-gen-rust" }
korek-gen-proto = { path = "crates/korek-gen-proto" }
korek-gen-zod = { path = "crates/korek-gen-zod" }
korek-gen-ts = { path = "crates/korek-gen-ts" }
korek = { path = "crates/korek" }
korek-testkit = { path = "crates/korek-testkit" }
anyhow = "1"
blake3 = "1"
bpaf = { version = "0.9", features = ["derive"] }
divan = "0.1"
heck = "0.5"
insta = "1"
kdl = { version = "6", default-features = false, features = ["span"] }
miette = "7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
clone_on_ref_ptr = "deny"
many_single_char_names = "allow"
