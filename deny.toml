# cargo-deny: `cargo deny check` (CI's `deny` job).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# Every RustSec advisory fails the check, unmaintained and unsound included;
# add an `ignore` entry (with a reason) only after reading the advisory.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Anything not listed fails the check, so every
# copyleft license (GPL, LGPL, AGPL, MPL, EPL, ...) does. Add a license here
# only if it is permissive.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory: no warning for an allowed
# license no dependency uses (yet).
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace (publish = false crates) carry no
# version.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# kdl-load, kdl-nodes and kdl-span until kdl-kit is on crates.io; then
# empty this list.
allow-git = ["https://github.com/talaagent/kdl-kit"]
