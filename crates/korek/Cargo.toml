[package]
name = "korek"
description = "Define types once in KDL, generate Rust, Protobuf, Zod and TypeScript: the driver and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "korek"

[lints]
workspace = true

[[bin]]
name = "korek"
path = "src/main.rs"

[[bin]]
name = "korek-gen-rust"
path = "src/bin/korek-gen-rust.rs"

[[bin]]
name = "korek-gen-proto"
path = "src/bin/korek-gen-proto.rs"

[[bin]]
name = "korek-gen-zod"
path = "src/bin/korek-gen-zod.rs"

[[bin]]
name = "korek-gen-ts"
path = "src/bin/korek-gen-ts.rs"

[dependencies]
bpaf.workspace = true
korek-core.workspace = true
korek-gen-proto.workspace = true
korek-gen-rust.workspace = true
korek-gen-ts.workspace = true
korek-gen-zod.workspace = true
korek-plugin.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
