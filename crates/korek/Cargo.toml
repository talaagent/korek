[package]
name = "korek"
description = "Schema-first code generation: define types, settings keys and RPC services once in KDL, generate Rust, Protobuf, Zod, TypeScript and JSON Schema (library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek"
readme = "README.md"
keywords = ["schema", "codegen", "protobuf", "zod", "json-schema"]
categories = ["development-tools", "encoding"]
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["generators"]
# The first-party generator libraries, callable in-process.
generators = ["dep:korek-gen-rust", "dep:korek-gen-proto", "dep:korek-gen-zod", "dep:korek-gen-ts", "dep:korek-gen-jsonschema", "dep:korek-gen-docs"]
miette = ["korek-core/miette"]

[dependencies]
blake3.workspace = true
korek-core.workspace = true
korek-gen-docs = { workspace = true, optional = true }
korek-gen-jsonschema = { workspace = true, optional = true }
korek-gen-proto = { workspace = true, optional = true }
korek-gen-rust = { workspace = true, optional = true }
korek-gen-ts = { workspace = true, optional = true }
korek-gen-zod = { workspace = true, optional = true }
korek-ir.workspace = true
korek-plugin.workspace = true
korek-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[package.metadata.docs.rs]
all-features = true
