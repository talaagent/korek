[package]
name = "korek-cli"
description = "Schema-first code generator CLI: KDL schemas to Rust, Protobuf (protovalidate), Zod, TypeScript, JSON Schema and docs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-cli"
readme = "README.md"
keywords = ["schema", "codegen", "protobuf", "zod", "typescript"]
categories = ["command-line-utilities", "development-tools::build-utils"]
rust-version.workspace = true
default-run = "korek"

[lints]
workspace = true

[features]
default = ["builtin"]
# Link the first-party generators and run them in-process (a
# `korek-gen-<name>` on PATH or `--plugin` still overrides them).
builtin = ["korek/generators"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "korek"
path = "src/main.rs"
doc = false

[[bin]]
name = "korek-gen-rust"
path = "src/bin/korek-gen-rust.rs"
doc = false

[[bin]]
name = "korek-gen-proto"
path = "src/bin/korek-gen-proto.rs"
doc = false

[[bin]]
name = "korek-gen-zod"
path = "src/bin/korek-gen-zod.rs"
doc = false

[[bin]]
name = "korek-gen-ts"
path = "src/bin/korek-gen-ts.rs"
doc = false

[[bin]]
name = "korek-gen-jsonschema"
path = "src/bin/korek-gen-jsonschema.rs"
doc = false

[[bin]]
name = "korek-gen-docs"
path = "src/bin/korek-gen-docs.rs"
doc = false

[dependencies]
anyhow.workspace = true
bpaf.workspace = true
korek = { workspace = true, features = ["miette"] }
korek-gen-docs.workspace = true
korek-gen-jsonschema.workspace = true
korek-gen-proto.workspace = true
korek-gen-rust.workspace = true
korek-gen-ts.workspace = true
korek-gen-zod.workspace = true
korek-plugin.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde_json.workspace = true

[dev-dependencies]
divan.workspace = true
insta.workspace = true
korek = { workspace = true, features = ["generators"] }
korek-core.workspace = true
korek-ir.workspace = true
korek-runtime.workspace = true
korek-testkit.workspace = true
serde.workspace = true
tempfile.workspace = true

[[bench]]
name = "gen"
harness = false

[package.metadata.docs.rs]
all-features = true
