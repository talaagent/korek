[package]
name = "korek-cli"
description = "The korek CLI: load a schema and run generator plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "korek"

[lints]
workspace = true

[features]
default = ["builtin"]
# Link the first-party generators and run them in-process (a
# `korek-gen-<name>` on PATH or `--plugin` still overrides them).
builtin = ["korek/generators"]

[[bin]]
name = "korek"
path = "src/main.rs"

[[bin]]
name = "korek-gen-rust"
path = "src/bin/korek-gen-rust.rs"

[[bin]]
name = "korek-gen-proto"
path = "src/bin/korek-gen-proto.rs"

[[bin]]
name = "korek-gen-zod"
path = "src/bin/korek-gen-zod.rs"

[[bin]]
name = "korek-gen-ts"
path = "src/bin/korek-gen-ts.rs"

[[bin]]
name = "korek-gen-jsonschema"
path = "src/bin/korek-gen-jsonschema.rs"

[[bin]]
name = "korek-gen-docs"
path = "src/bin/korek-gen-docs.rs"

[dependencies]
anyhow.workspace = true
bpaf.workspace = true
korek = { workspace = true, default-features = false, features = ["miette"] }
korek-gen-docs.workspace = true
korek-gen-jsonschema.workspace = true
korek-gen-proto.workspace = true
korek-gen-rust.workspace = true
korek-gen-ts.workspace = true
korek-gen-zod.workspace = true
korek-plugin.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde_json.workspace = true

[dev-dependencies]
korek = { workspace = true }
korek-runtime.workspace = true
serde.workspace = true
tempfile.workspace = true
