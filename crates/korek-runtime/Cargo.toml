[package]
name = "korek-runtime"
description = "Runtime for Rust generated by korek: validation with field paths, string formats, base64, durations, typed keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-runtime"
readme = "README.md"
keywords = ["validation", "serde", "codegen", "schema"]
categories = ["encoding", "development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["regex", "json"]
# `pattern` rules and the emoji format.
regex = ["dep:regex"]
# `json` fields (`serde_json::Value`).
json = ["dep:serde_json"]

[dependencies]
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
