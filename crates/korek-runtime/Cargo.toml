[package]
name = "korek-runtime"
description = "Runtime for Rust generated by korek: validation with field paths, string formats, base64, durations, typed keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-runtime"
readme = "README.md"
keywords = ["validation", "serde", "codegen", "schema"]
categories = ["encoding", "development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "regex", "json"]
# Without it the crate is no_std + alloc. Gates `time::now` (so the
# `past`/`future`/`within` rules) and std support in the dependencies.
std = ["serde/std", "serde_json?/std", "regex-automata?/std"]
# `pattern` rules and the emoji format.
regex = ["dep:regex-automata", "dep:once_cell"]
# `json` fields (`serde_json::Value`).
json = ["dep:serde_json"]

[dependencies]
once_cell = { workspace = true, optional = true }
regex-automata = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
