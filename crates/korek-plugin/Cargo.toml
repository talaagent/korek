[package]
name = "korek-plugin"
description = "Write korek code generator plugins: the JSON plugin protocol, run helper and hooks (no parser dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-plugin"
readme = "README.md"
keywords = ["codegen", "plugin", "schema", "protocol"]
categories = ["development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is no_std + alloc (the protocol types, `Encoding`,
# `Hook`). Gates `run`, which reads stdin, writes stdout and reads
# `KOREK_ENCODING`.
std = ["serde/std", "serde_json/std"]

[dependencies]
korek-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
