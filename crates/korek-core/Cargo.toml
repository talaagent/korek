[package]
name = "korek-core"
description = "korek's schema parser, lowering and validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# miette::Diagnostic rendering of diagnostics.
miette = ["dep:miette", "kdl-span/miette"]

[dependencies]
kdl.workspace = true
kdl-load.workspace = true
kdl-nodes.workspace = true
kdl-span.workspace = true
korek-ir.workspace = true
korek-runtime.workspace = true
miette = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
miette = { workspace = true, features = ["fancy"] }
insta.workspace = true
