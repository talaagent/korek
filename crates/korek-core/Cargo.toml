[package]
name = "korek-core"
description = "korek's schema front end: KDL v2 parsing, lowering to the IR, validation and stable Protobuf numbering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-core"
readme = "README.md"
keywords = ["schema", "kdl", "validation", "codegen", "parser"]
categories = ["parser-implementations", "development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[features]
# miette::Diagnostic rendering of diagnostics.
miette = ["dep:miette", "kdl-span/miette"]

[dependencies]
kdl-load.workspace = true
kdl-nodes.workspace = true
kdl-span.workspace = true
korek-ir.workspace = true
korek-runtime.workspace = true
miette = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
miette = { workspace = true, features = ["fancy"] }
insta.workspace = true

[package.metadata.docs.rs]
all-features = true
