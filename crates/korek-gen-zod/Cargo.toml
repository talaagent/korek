[package]
name = "korek-gen-zod"
description = "korek's Zod v4 code generator: schemas checked against the generated TypeScript types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/korek-gen-zod"
readme = "README.md"
keywords = ["zod", "typescript", "codegen", "validation", "schema"]
categories = ["development-tools::build-utils"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
korek-gen-common.workspace = true
korek-gen-ts.workspace = true
korek-ir.workspace = true
korek-plugin.workspace = true
serde_json = { workspace = true, features = ["std"] }
