version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # The test-only TypeScript dependencies (package.json, bun.lock).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      ts-test-dependencies:
        patterns: ["*"]
