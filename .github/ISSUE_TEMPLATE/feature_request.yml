name: Feature request
description: Suggest a schema feature, generator, validation rule or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to generate or validate, and where does korek fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example schema and the output you would expect for each target, and any alternatives you considered.
    validations:
      required: true
