name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Remove credentials and private schemas from logs and examples. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small schema (KDL) and the korek command or Rust call that shows the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the diagnostic or the generated output, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: "`korek --version` or the crate versions, Rust version, OS, and the generator and options involved."
    validations:
      required: true
